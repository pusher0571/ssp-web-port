[preset.0]
name="Web"
platform="HTML5"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter="*.sspmr,*.txt,*.json"
exclude_filter=".tools/*,hosting/*,web/*,.github/*,docs/*,debug/*,addons/*,vr/*"
export_path="dist/index.html"
script_export_mode=1
script_encryption_key=""

[preset.0.options]
custom_template/debug=".tools/webassembly_debug.zip"
custom_template/release=".tools/webassembly_release.zip"
variant/export_type=0
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://web/shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
