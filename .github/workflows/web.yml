name: Build and deploy web game
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot and web templates
        id: cache
        uses: actions/cache@v4
        with:
          path: .tools
          key: godot-3.6.2-linux-web-threads-v2
      - name: Install official Godot 3.6.2
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/3.6.2-stable/Godot_v3.6.2-stable_linux_headless.64.zip -o /tmp/godot.zip
          unzip -o /tmp/godot.zip -d .tools
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/3.6.2-stable/Godot_v3.6.2-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -j /tmp/templates.tpz templates/webassembly_threads_release.zip templates/webassembly_threads_debug.zip -d .tools
          chmod +x .tools/Godot_v3.6.2-stable_linux_headless.64
      - name: Build game
        run: python3 tools/build_web.py --godot "$PWD/.tools/Godot_v3.6.2-stable_linux_headless.64"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
